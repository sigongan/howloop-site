name: Refresh bank products

on:
  schedule:
    # Monday 06:23 in Brisbane (UTC+10). GitHub may delay scheduled runs.
    - cron: '23 20 * * 0'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-bank-data.yml'
      - 'scripts/update-bank-data.mjs'
      - 'tests/bank-refresh.test.mjs'

permissions:
  contents: read

concurrency:
  group: bank-product-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'sigongan/howloop-site' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test calculations and refresh failure handling
        run: npm test
      - name: Retrieve and validate public CDR products
        run: npm run refresh:rates
      - name: Build site with refreshed snapshots
        run: npm run build
      - name: Validate built pages and bank data
        run: npm run check:readiness
      - name: Publish validated data to the connected site
        shell: bash
        run: |
          git add -- src/data/banks.json public/data/banks.json public/data/banks/
          if git diff --cached --quiet; then
            echo 'No data changes to publish.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh public bank product snapshots'
          # A concurrent main-branch update fails safely; never force-push.
          git push origin HEAD:main
          echo 'Validated snapshots committed. The connected Cloudflare Pages project will build this commit.' >> "$GITHUB_STEP_SUMMARY"
