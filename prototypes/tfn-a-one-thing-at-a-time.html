<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototype A — One thing at a time</title>
<style>
  :root{
    --paper:#fbfaf7; --paper-deep:#f2efe8; --ink:#14171c; --ink-2:#4a5058; --ink-3:#7b828c;
    --line:#ddd8cd; --green:#0d9b6c; --green-soft:#e6f5ef; --orange:#ee6c1e; --orange-soft:#fdeee3;
    --radius:14px;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);line-height:1.55;-webkit-font-smoothing:antialiased}
  .wrap{max-width:760px;margin:0 auto;padding:28px 20px 90px}

  .protolabel{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-bottom:26px}

  h1{font-size:2rem;line-height:1.15;margin:0 0 10px;letter-spacing:-.02em}
  .sub{font-size:1.05rem;color:var(--ink-2);margin:0 0 30px;max-width:52ch}

  /* progress */
  .rail{display:flex;gap:6px;margin-bottom:26px}
  .rail i{flex:1;height:5px;border-radius:99px;background:var(--line);transition:background .35s}
  .rail i.on{background:var(--green)}

  /* card */
  .card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:26px 22px 24px}
  .qnum{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px}
  .q{font-size:1.45rem;line-height:1.25;margin:0 0 6px;letter-spacing:-.015em}
  .qhint{color:var(--ink-2);font-size:.95rem;margin:0 0 22px}

  .opts{display:grid;gap:12px}
  @media(min-width:560px){.opts{grid-template-columns:1fr 1fr}}
  .opt{
    display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;
    background:var(--paper);border:2px solid var(--line);border-radius:var(--radius);
    padding:20px 16px;font:inherit;font-size:1rem;font-weight:600;color:var(--ink);
    cursor:pointer;transition:border-color .18s,background .18s,transform .18s;
  }
  .opt:hover,.opt:focus-visible{border-color:var(--orange);background:var(--orange-soft);transform:translateY(-2px)}
  .opt:focus-visible{outline:3px solid var(--orange);outline-offset:3px}
  .opt small{display:block;font-weight:400;font-size:.85rem;color:var(--ink-2);line-height:1.4}
  .opt svg{width:82px;height:82px;display:block}

  /* breadcrumb */
  .trail{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;min-height:0}
  .trail b{font-weight:600;font-size:.8rem;background:var(--green-soft);color:#0a6d4c;border-radius:99px;padding:5px 12px}
  .restart{background:none;border:0;font:inherit;font-size:.85rem;color:var(--ink-3);text-decoration:underline;cursor:pointer;padding:5px 2px}
  .restart:hover{color:var(--ink)}

  /* outcome */
  .out h2{font-size:1.6rem;line-height:1.2;margin:2px 0 4px;letter-spacing:-.02em}
  .tag{display:inline-block;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:#0a6d4c;background:var(--green-soft);border-radius:99px;padding:5px 11px;margin-bottom:12px}
  .outlead{color:var(--ink-2);margin:0 0 26px}

  .sect{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin:28px 0 12px;font-weight:700}

  /* things you need — illustrated */
  .things{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:12px}
  .thing{border:1px solid var(--line);border-radius:12px;background:#fff;padding:14px 12px;text-align:center}
  .thing svg{width:100%;height:64px;margin-bottom:8px}
  .thing b{display:block;font-size:.92rem;line-height:1.3}
  .thing span{display:block;font-size:.8rem;color:var(--ink-2);margin-top:3px}
  .thing.none{grid-column:1/-1;display:flex;align-items:center;gap:14px;text-align:left;background:var(--green-soft);border-color:#bfe4d5}
  .thing.none svg{width:56px;height:56px;margin:0;flex:none}

  /* steps */
  ol.steps{list-style:none;margin:0;padding:0;counter-reset:s}
  ol.steps li{counter-increment:s;display:flex;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
  ol.steps li:first-child{border-top:0}
  ol.steps li::before{
    content:counter(s);flex:none;width:30px;height:30px;border-radius:50%;
    background:var(--orange);color:#fff;font-weight:700;font-size:.9rem;
    display:grid;place-items:center;margin-top:1px
  }
  ol.steps p{margin:0}
  ol.steps b{display:block;margin-bottom:2px}
  ol.steps span{color:var(--ink-2);font-size:.94rem}

  /* timeline */
  .time{display:flex;align-items:center;gap:10px;background:var(--paper-deep);border-radius:12px;padding:16px;margin-top:6px}
  .time svg{flex:none;width:40px;height:40px}
  .time b{display:block}
  .time span{color:var(--ink-2);font-size:.92rem}

  .warn{margin-top:30px;border-left:4px solid var(--orange);background:var(--orange-soft);border-radius:0 10px 10px 0;padding:14px 16px}
  .warn b{display:block;margin-bottom:4px}
  .warn p{margin:0;font-size:.94rem;color:var(--ink-2)}

  .fade{animation:f .3s ease}
  @keyframes f{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.fade{animation:none}.opt{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <p class="protolabel">Prototype A · one thing at a time</p>

  <h1>Get an Australian Tax File Number</h1>
  <p class="sub">There are four completely different ways to apply. Pick the wrong one and you wait weeks for nothing. Two questions and you'll know which one is yours.</p>

  <div class="rail" id="rail"><i class="on"></i><i></i><i></i></div>
  <div class="trail" id="trail"></div>
  <div id="stage"></div>
</div>

<script>
/* ---------- illustrations ---------- */
const I = {
  passportAU: `<svg viewBox="0 0 100 100" fill="none" stroke="#14171c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="26" y="16" width="48" height="68" rx="6" fill="#ee6c1e" fill-opacity=".14"/>
    <circle cx="50" cy="44" r="11"/><path d="M39 44h22M50 33c4 4 4 18 0 22M50 33c-4 4-4 18 0 22"/>
    <path d="M40 66h20M44 74h12"/></svg>`,
  passportOther: `<svg viewBox="0 0 100 100" fill="none" stroke="#14171c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="26" y="16" width="48" height="68" rx="6" fill="#f2efe8"/>
    <path d="M38 38h24M38 48h24M38 58h14"/><circle cx="50" cy="26" r="0"/></svg>`,
  visa: `<svg viewBox="0 0 100 100" fill="none" stroke="#14171c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="16" y="26" width="68" height="48" rx="6" fill="#e6f5ef"/>
    <path d="M16 42h68"/><circle cx="34" cy="58" r="7" stroke="#0d9b6c"/>
    <path d="M50 54h22M50 62h14" stroke="#0d9b6c"/></svg>`,
  noVisa: `<svg viewBox="0 0 100 100" fill="none" stroke="#14171c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="16" y="26" width="68" height="48" rx="6" fill="#f2efe8"/>
    <path d="M16 42h68"/><path d="M34 52l16 16M50 52l-16 16" stroke="#ee6c1e"/></svg>`,
  inAU: `<svg viewBox="0 0 100 100" fill="none" stroke="#14171c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 52c6-14 18-22 30-20s16 10 26 8 12 8 8 16-16 18-32 18-38-8-32-22Z" fill="#e6f5ef"/>
    <circle cx="58" cy="52" r="6" fill="#0d9b6c" stroke="none"/>
    <path d="M58 40v-8" stroke="#0d9b6c"/></svg>`,
  outAU: `<svg viewBox="0 0 100 100" fill="none" stroke="#14171c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="50" cy="50" r="28"/><path d="M22 50h56M50 22c9 9 9 47 0 56M50 22c-9 9-9 47 0 56"/>
    <path d="M74 30l12-12M86 18h-9M86 18v9" stroke="#ee6c1e"/></svg>`,
  phone: `<svg viewBox="0 0 100 100" fill="none" stroke="#14171c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <rect x="32" y="14" width="36" height="72" rx="7" fill="#e6f5ef"/><path d="M44 22h12"/>
    <path d="M42 52l6 7 12-15" stroke="#0d9b6c" stroke-width="4"/></svg>`,
  licence: `<svg viewBox="0 0 100 100" fill="none" stroke="#14171c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <rect x="12" y="28" width="76" height="46" rx="6" fill="#fff"/>
    <circle cx="34" cy="48" r="8"/><path d="M24 64c2-6 6-8 10-8s8 2 10 8"/><path d="M56 44h22M56 54h16"/></svg>`,
  medicare: `<svg viewBox="0 0 100 100" fill="none" stroke="#14171c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <rect x="12" y="28" width="76" height="46" rx="6" fill="#e6f5ef"/>
    <path d="M50 40v22M39 51h22" stroke="#0d9b6c" stroke-width="5"/></svg>`,
  cert: `<svg viewBox="0 0 100 100" fill="none" stroke="#14171c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <rect x="22" y="14" width="56" height="60" rx="5" fill="#fff"/><path d="M34 32h32M34 44h32M34 56h18"/>
    <circle cx="68" cy="66" r="10" fill="#fdeee3" stroke="#ee6c1e"/></svg>`,
  nothing: `<svg viewBox="0 0 100 100" fill="none" stroke="#0d9b6c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="50" cy="50" r="34" stroke="#0d9b6c" stroke-opacity=".3"/><path d="M34 51l11 13 21-27"/></svg>`,
  post: `<svg viewBox="0 0 100 100" fill="none" stroke="#14171c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <rect x="14" y="30" width="72" height="44" rx="5" fill="#fdeee3"/><path d="M14 34l36 24 36-24" stroke="#ee6c1e"/></svg>`,
  counter: `<svg viewBox="0 0 100 100" fill="none" stroke="#14171c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 62h72M20 62V40h60v22" fill="#f2efe8"/><circle cx="38" cy="30" r="7"/><path d="M28 44c2-6 5-8 10-8s8 2 10 8"/>
    <path d="M60 50h14" stroke="#ee6c1e"/></svg>`,
  clock: `<svg viewBox="0 0 100 100" fill="none" stroke="#14171c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="50" cy="52" r="32" fill="#f2efe8"/><path d="M50 32v20l14 10" stroke="#ee6c1e"/></svg>`,
  letter: `<svg viewBox="0 0 100 100" fill="none" stroke="#14171c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <rect x="18" y="24" width="64" height="52" rx="5" fill="#fff"/><path d="M30 42h40M30 54h40M30 66h22"/></svg>`
};

/* ---------- content ---------- */
const NODES = {
  start:{
    n:1,
    q:"Do you have your own Australian passport?",
    hint:"Your own — not a parent's or partner's.",
    opts:[
      {ill:I.passportAU,label:"Yes, I have one",small:"Australian citizen",go:"citizen",trail:"Australian passport"},
      {ill:I.passportOther,label:"No",small:"I have another country's passport, or none",go:"visa",trail:"No Australian passport"}
    ]
  },
  visa:{
    n:2,
    q:"Are you in Australia on a visa that lets you work?",
    hint:"Not sure? Check your visa on VEVO. New Zealanders get work rights automatically on arrival.",
    opts:[
      {ill:I.visa,label:"Yes, I can work",small:"Working holiday, student with work rights, skilled, most others",go:"iar",trail:"Work visa"},
      {ill:I.noVisa,label:"No, or I'm not sure",small:"No visa, or it says no work",go:"where",trail:"No work visa"}
    ]
  },
  where:{
    n:3,
    q:"Are you in Australia right now?",
    hint:"",
    opts:[
      {ill:I.inAU,label:"Yes, I'm here",small:"Living in Australia",go:"inperson",trail:"In Australia"},
      {ill:I.outAU,label:"No, I'm overseas",small:"Living outside Australia",go:"overseas",trail:"Overseas"}
    ]
  }
};

const OUT = {
  citizen:{
    tag:"Fastest route · online",
    title:"Apply on your phone. You'll likely see the number today.",
    lead:"Citizens with a passport get the quickest path. It's all done in an app plus a website, and no post is involved.",
    need:[
      {ill:I.passportAU,b:"Your Australian passport",s:"Must be current"},
      {ill:I.licence,b:"One more ID",s:"Driver's licence or learner's permit"},
      {ill:I.medicare,b:"…or Medicare card",s:"Any one of these works"},
      {ill:I.cert,b:"…or citizenship certificate",s:"Any one of these works"}
    ],
    steps:[
      ["Set up myID on your phone","A free government ID app. You scan your passport, add one more document, then take a selfie so it can check your face against your passport photo. One time only."],
      ["Sign in to myGov and link the ATO","myGov is the front door to government services. myID is the key that opens it."],
      ["Fill in the TFN application","Short form. Name, date of birth, address."]
    ],
    time:{b:"Usually the same day",s:"The number appears on screen. If it needs checking, up to 28 days."},
    got:"The number shows on screen and you can save it. A letter also lands in your myGov Inbox."
  },
  iar:{
    tag:"No documents to send",
    title:"Apply online. The ATO checks your visa for you.",
    lead:"This is the only route where you send nothing at all. You type in your passport and visa numbers, and the ATO checks them straight against immigration records.",
    need:[
      {none:true,ill:I.nothing,b:"Nothing to post, scan or photocopy",s:"Just your passport and visa details typed into the form."}
    ],
    steps:[
      ["Check your visa is active on VEVO","This is the one that catches people out. If your visa isn't showing as in effect yet, the application gets rejected and you start over."],
      ["Open the ATO's online application for migrants and visitors","Search: ATO TFN foreign passport holders."],
      ["Enter your passport and visa details, plus an Australian postal address","The letter goes to that address, so make sure you'll still be there."]
    ],
    time:{b:"Up to 28 days",s:"Don't apply twice while you wait. A second application makes it slower, not faster."},
    got:"A letter with your TFN, posted to the Australian address you gave.",
    warn:{b:"Some visas block this route",p:"If your visa carries condition 8101, 8103 or 8116, it means no work, and this online route won't accept you. Go in person instead."}
  },
  inperson:{
    tag:"In person",
    title:"You'll need to show your documents at a counter.",
    lead:"Without an Australian passport or a work visa the ATO can check online, someone has to look at your documents in person. Both options below are free.",
    need:[
      {ill:I.cert,b:"Original documents",s:"Not photocopies. Current, not expired."},
      {ill:I.counter,b:"A counter appointment",s:"Australia Post or Services Australia"},
      {ill:I.letter,b:"Your printed form",s:"For the Australia Post route"}
    ],
    steps:[
      ["Pick your counter","Australia Post: fill in the form online first, print the summary, then visit a participating outlet within 30 days. Services Australia: fill in the paper form NAT 1432 at the centre."],
      ["Bring your original ID documents","Staff look at them, you sign, they send it off. Which documents count depends on what you have, so check the ATO's list before you leave home."],
      ["Wait for the letter","Nothing else to do once it's lodged."]
    ],
    time:{b:"Up to 28 days",s:"Counted from when your documents were seen, not from when you first started the form."},
    got:"A letter with your TFN, posted to you. If you want it shared with Centrelink, say so on the form."
  },
  overseas:{
    tag:"Paper form, by post",
    title:"You post a form. This one is slow by design.",
    lead:"There's no way to check who you are in person from overseas, so this route uses certified copies and the post.",
    need:[
      {ill:I.letter,b:"Form NAT 2628",s:"Download from ato.gov.au"},
      {ill:I.cert,b:"Certified copies of your ID",s:"Copies, never the originals"},
      {ill:I.post,b:"Postage","s":"To the address printed on the form"}
    ],
    steps:[
      ["Check you actually need one","If your only Australian income is interest, dividends or royalties, you usually don't need a TFN at all — a different tax rate applies instead."],
      ["Download and complete NAT 2628","Or order it by phone on 1300 720 092."],
      ["Get your ID documents certified, then post everything together","Certified means an authorised person has signed to say the copy matches the original."]
    ],
    time:{b:"Up to 28 days after it arrives",s:"Plus international post time in both directions."},
    got:"A letter with your TFN, posted to the address on your form."
  }
};

const SAFETY = {b:"Once you have it, guard it",p:"Only your employer (after you start work), your bank, your super fund and a registered tax agent ever need your TFN. Never put it on a resume. The ATO will never text or email you a link asking you to log in."};

/* ---------- engine ---------- */
const stage=document.getElementById('stage'), trailEl=document.getElementById('trail'), rail=document.getElementById('rail');
let trail=[];

function setRail(n){[...rail.children].forEach((b,i)=>b.classList.toggle('on',i<n));}

function drawTrail(){
  trailEl.innerHTML = trail.map(t=>`<b>${t}</b>`).join('') +
    (trail.length?`<button class="restart" onclick="start()">start over</button>`:'');
}

function question(id){
  const nd=NODES[id]; setRail(nd.n);
  stage.innerHTML=`<div class="card fade">
    <p class="qnum">Question ${nd.n}</p>
    <h2 class="q">${nd.q}</h2>
    ${nd.hint?`<p class="qhint">${nd.hint}</p>`:'<div style="height:14px"></div>'}
    <div class="opts">${nd.opts.map((o,i)=>
      `<button class="opt" data-i="${i}">${o.ill}<span>${o.label}<small>${o.small}</small></span></button>`).join('')}
    </div></div>`;
  stage.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const o=nd.opts[+b.dataset.i]; trail.push(o.trail); drawTrail();
    NODES[o.go]?question(o.go):outcome(o.go);
  });
  stage.querySelector('.q').setAttribute('tabindex','-1');
}

function outcome(id){
  const o=OUT[id]; setRail(3);
  stage.innerHTML=`<div class="card out fade">
    <span class="tag">${o.tag}</span>
    <h2>${o.title}</h2>
    <p class="outlead">${o.lead}</p>

    <p class="sect">What you need</p>
    <div class="things">${o.need.map(t=>
      `<div class="thing${t.none?' none':''}">${t.ill}<div><b>${t.b}</b><span>${t.s}</span></div></div>`).join('')}
    </div>

    <p class="sect">What you do</p>
    <ol class="steps">${o.steps.map(s=>`<li><p><b>${s[0]}</b><span>${s[1]}</span></p></li>`).join('')}</ol>

    <p class="sect">How long</p>
    <div class="time">${I.clock}<div><b>${o.time.b}</b><span>${o.time.s}</span></div></div>

    <p class="sect">What arrives</p>
    <div class="time">${I.letter}<div><span>${o.got}</span></div></div>

    ${o.warn?`<div class="warn"><b>${o.warn.b}</b><p>${o.warn.p}</p></div>`:''}
    <div class="warn"><b>${SAFETY.b}</b><p>${SAFETY.p}</p></div>
  </div>`;
  stage.querySelector('h2').setAttribute('tabindex','-1');
  stage.querySelector('h2').focus({preventScroll:true});
}

function start(){trail=[];drawTrail();question('start');}
start();
</script>
</body>
</html>
