<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>HOWLOOP — production desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --void:#08080A; --panel:#101013; --panel2:#17171B; --line:#26262C; --line2:#34343C;
  --bone:#ECE8E1; --steel:#8A8F99; --dim:#5C606A;
  --amber:#E9A63C; --red:#E23A24; --cold:#6E8DA6;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --cond:'Barlow Condensed',sans-serif;
  --body:'IBM Plex Sans',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--void);color:var(--bone);font-family:var(--body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
::selection{background:var(--amber);color:#000}

/* ── shell ── */
.top{display:flex;align-items:center;gap:18px;padding:0 18px;height:52px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--void);z-index:30}
.brand{font-family:var(--cond);font-weight:700;font-size:20px;letter-spacing:.14em;text-transform:uppercase}
.brand span{color:var(--red)}
.top .grow{flex:1}
.tally{font-family:var(--mono);font-size:11px;color:var(--steel);letter-spacing:.04em;white-space:nowrap}
.tally b{color:var(--amber);font-weight:500}

.shell{display:grid;grid-template-columns:212px 1fr;min-height:calc(100vh - 52px)}
.rail{border-right:1px solid var(--line);padding:16px 0;background:var(--panel)}
.railhead{font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--dim);padding:0 16px 10px}
.epbtn{display:block;width:100%;text-align:left;padding:9px 16px;border-left:2px solid transparent;color:var(--steel);font-family:var(--cond);font-size:16px;letter-spacing:.03em}
.epbtn small{display:block;font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.06em}
.epbtn:hover{color:var(--bone);background:var(--panel2)}
.epbtn.on{color:var(--bone);border-left-color:var(--amber);background:var(--panel2)}
.railact{margin:14px 16px 0;padding-top:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:7px}

.main{padding:24px 28px 90px;max-width:1080px}
.ephead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:4px}
.epno{font-family:var(--mono);font-size:11px;color:var(--red);letter-spacing:.2em;border:1px solid var(--red);padding:2px 7px}
.epname{font-family:var(--cond);font-weight:700;font-size:34px;letter-spacing:.02em;text-transform:uppercase;line-height:1.05}
.epsub{color:var(--dim);font-size:12.5px;margin-bottom:20px}

/* ── instrument strip ── */
.gauges{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin-bottom:10px}
.g{background:var(--panel);padding:11px 13px;position:relative}
.g::before,.g::after{content:"";position:absolute;width:7px;height:7px;border:1px solid var(--red);opacity:.5}
.g::before{top:5px;left:5px;border-right:0;border-bottom:0}
.g::after{bottom:5px;right:5px;border-left:0;border-top:0}
.g .lab{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;color:var(--dim)}
.g .val{font-family:var(--cond);font-weight:700;font-size:29px;line-height:1.1;color:var(--amber)}
.g .val.bad{color:var(--red)}
.g .lim{font-family:var(--mono);font-size:10px;color:var(--dim)}
.g .bar{height:2px;background:var(--line2);margin-top:7px;position:relative;overflow:hidden}
.g .bar i{position:absolute;inset:0 auto 0 0;background:var(--amber)}
.g .bar i.bad{background:var(--red)}
.formula{font-family:var(--mono);font-size:11px;color:var(--steel);border:1px solid var(--line);border-top:0;padding:8px 13px;margin-bottom:22px;letter-spacing:.02em;overflow-x:auto;white-space:nowrap}
.formula b{color:var(--amber);font-weight:500}
.formula .fail{color:var(--red)}

/* ── tabs ── */
.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto}
.tab{padding:9px 16px;font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--dim);border-bottom:2px solid transparent;white-space:nowrap}
.tab:hover{color:var(--steel)}
.tab.on{color:var(--bone);border-bottom-color:var(--red)}

/* ── generic blocks ── */
.sec{margin-bottom:30px}
.sech{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--dim);margin-bottom:10px;display:flex;align-items:center;gap:10px}
.sech::after{content:"";flex:1;height:1px;background:var(--line)}
.card{border:1px solid var(--line);background:var(--panel);padding:16px 18px}
.note{color:var(--steel);font-size:13px}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 14px;font-size:13px}
.kv dt{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--dim);padding-top:3px}
.kv dd{margin:0}
.pill{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.08em;padding:2px 7px;border:1px solid var(--line2);color:var(--steel)}
.pill.red{border-color:var(--red);color:var(--red)}
.pill.cold{border-color:var(--cold);color:var(--cold)}
.pill.amber{border-color:var(--amber);color:var(--amber)}
.slam{font-family:'Anton',sans-serif;font-size:clamp(28px,5vw,46px);letter-spacing:.01em;line-height:1;text-transform:uppercase;color:#fff;text-shadow:0 0 30px rgba(233,166,60,.18)}
ol.titles{list-style:none;margin:0;padding:0;counter-reset:t}
ol.titles li{counter-increment:t;display:flex;gap:12px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line)}
ol.titles li:last-child{border-bottom:0}
ol.titles li::before{content:counter(t,decimal-leading-zero);font-family:var(--mono);font-size:10px;color:var(--dim)}
ol.titles .t{flex:1;font-family:var(--cond);font-size:19px;font-weight:600}
ol.titles .len{font-family:var(--mono);font-size:10px;color:var(--dim)}

/* ── cuts ── */
.cut{border:1px solid var(--line);background:var(--panel);margin-bottom:12px;display:grid;grid-template-columns:78px 1fr;position:relative}
.cut.main{border-color:var(--cold)}
.cutn{border-right:1px solid var(--line);padding:14px 0;text-align:center;background:var(--panel2)}
.cut.main .cutn{border-right-color:var(--cold)}
.cutn .num{font-family:var(--cond);font-weight:700;font-size:30px;line-height:1;color:var(--steel)}
.cut.main .cutn .num{color:var(--cold)}
.cutn .role{font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;color:var(--dim);margin-top:4px}
.cutn .tc{font-family:var(--mono);font-size:9.5px;color:var(--dim);margin-top:8px}
.cutb{padding:13px 16px}
.vo{width:100%;background:transparent;border:0;border-left:2px solid var(--line2);padding:2px 0 2px 12px;color:var(--bone);font-family:var(--body);font-size:15.5px;line-height:1.45;resize:none;overflow:hidden}
.cut.main .vo{border-left-color:var(--cold)}
.vo:focus{border-left-color:var(--amber);background:rgba(233,166,60,.04)}
.cutmeta{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px;align-items:center}
.hud{font-family:var(--mono);font-size:11px;color:var(--red);border:1px solid var(--red);padding:2px 8px;letter-spacing:.02em}
.osd{font-family:'Anton',sans-serif;font-size:14px;letter-spacing:.04em;color:#fff;background:#000;border:1px solid var(--line2);padding:2px 9px}
.sfx{font-family:var(--mono);font-size:10.5px;color:var(--steel)}
.wc{font-family:var(--mono);font-size:10px;color:var(--dim);margin-left:auto}

/* ── prompts ── */
.pr{border:1px solid var(--line);background:var(--panel);margin-bottom:14px}
.pr.main{border-color:var(--cold)}
.prh{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.pr.main .prh{border-bottom-color:var(--cold)}
.prt{font-family:var(--cond);font-weight:600;font-size:17px;letter-spacing:.03em}
.prtools{margin-left:auto;display:flex;gap:7px;align-items:center}
pre.code{margin:0;padding:14px 16px;font-family:var(--mono);font-size:12px;line-height:1.65;color:#C9D3D9;white-space:pre-wrap;word-break:break-word;max-height:340px;overflow:auto;background:#0B0B0E}
.reroll{padding:10px 16px;border-top:1px solid var(--line);background:var(--panel2)}
.reroll .rh{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--red);margin-bottom:5px}
.reroll ul{margin:0;padding-left:16px;color:var(--steel);font-size:12.5px}
.reroll li{margin:2px 0}

/* ── controls ── */
.btn{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;padding:6px 11px;border:1px solid var(--line2);color:var(--steel);transition:.12s}
.btn:hover{border-color:var(--amber);color:var(--amber)}
.btn.done{border-color:var(--amber);color:#000;background:var(--amber)}
.btn.pri{border-color:var(--red);color:var(--red)}
.btn.pri:hover{background:var(--red);color:#000}
.tick{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--dim);border:1px solid var(--line2);padding:5px 10px}
.tick i{width:9px;height:9px;border:1px solid var(--line2);display:block}
.tick.on{color:var(--amber);border-color:var(--amber)}
.tick.on i{background:var(--amber);border-color:var(--amber)}

table.facts{width:100%;border-collapse:collapse;font-size:13px}
table.facts th{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--dim);text-align:left;padding:7px 10px;border-bottom:1px solid var(--line2);font-weight:400}
table.facts td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.facts td:last-child{font-family:var(--mono);font-size:10.5px;color:var(--steel);white-space:nowrap}

.checkl{display:grid;gap:1px;background:var(--line);border:1px solid var(--line)}
.checkl button{display:flex;gap:11px;align-items:center;background:var(--panel);padding:9px 14px;text-align:left;font-size:13px;color:var(--steel);width:100%}
.checkl button i{width:10px;height:10px;border:1px solid var(--line2);flex:none}
.checkl button.on{color:var(--bone)}
.checkl button.on i{background:var(--amber);border-color:var(--amber)}

textarea.paste{width:100%;min-height:280px;background:#0B0B0E;border:1px solid var(--line);color:#C9D3D9;font-family:var(--mono);font-size:12px;padding:14px;line-height:1.6;resize:vertical}
.loopwrap{display:grid;grid-template-columns:1fr 40px 1fr;gap:0;align-items:stretch;border:1px solid var(--line)}
.loopcell{padding:16px 18px;background:var(--panel)}
.loopcell .lb{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;color:var(--dim);margin-bottom:7px}
.loopcell .lt{font-family:var(--cond);font-size:20px;font-weight:600}
.loopjoin{display:flex;align-items:center;justify-content:center;background:var(--panel2);border-left:1px solid var(--line);border-right:1px solid var(--line);color:var(--red);font-family:var(--mono);font-size:15px}

.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);background:var(--amber);color:#000;font-family:var(--mono);font-size:11px;letter-spacing:.1em;padding:9px 18px;opacity:0;pointer-events:none;transition:.18s;z-index:60}
.toast.on{opacity:1;transform:translate(-50%,0)}
.hide{display:none !important}

@media(max-width:820px){
  .shell{grid-template-columns:1fr}
  .rail{border-right:0;border-bottom:1px solid var(--line);display:flex;gap:8px;overflow-x:auto;padding:10px 12px;align-items:center}
  .railhead{display:none}
  .epbtn{width:auto;white-space:nowrap;border-left:0;border-bottom:2px solid transparent;padding:6px 10px}
  .epbtn.on{border-left:0;border-bottom-color:var(--amber)}
  .railact{margin:0;padding:0;border:0;flex-direction:row}
  .main{padding:18px 14px 80px}
  .gauges{grid-template-columns:repeat(2,1fr)}
  .cut{grid-template-columns:58px 1fr}
  .loopwrap{grid-template-columns:1fr;}
  .loopjoin{border:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;transform:rotate(90deg) scale(1)}
}
@media(prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>

<div class="top">
  <div class="brand">HOW<span>LOOP</span></div>
  <div class="grow"></div>
  <div class="tally" id="tally"></div>
</div>

<div class="shell">
  <nav class="rail">
    <div class="railhead">EPISODES</div>
    <div id="eplist"></div>
    <div class="railact">
      <button class="btn" onclick="go('import')">+ 새 에피소드</button>
      <button class="btn" onclick="copySchema()">스키마 복사</button>
    </div>
  </nav>

  <main class="main" id="main"></main>
</div>

<div class="toast" id="toast"></div>

<script>
/* ══════════════════════════════════════════════
   storage — localStorage on your own domain,
   memory fallback inside sandboxed previews
   ══════════════════════════════════════════════ */
const store=(()=>{let mem={},ok=true;
  try{localStorage.setItem('__t','1');localStorage.removeItem('__t')}catch(e){ok=false}
  return{
    get(k){if(ok){try{return localStorage.getItem(k)}catch(e){}}return k in mem?mem[k]:null},
    set(k,v){if(ok){try{localStorage.setItem(k,v);return}catch(e){}}mem[k]=v},
    live:ok
  }})();

const SCHEMA_NOTE=`howloop.how 대시보드에 붙여넣을 JSON으로 에피소드 패키지를 만들어줘.
LOCKED 템플릿(6컷·단어≤78·문장≤12·컷4 불가능한 컷·루프)을 그대로 적용하고,
아래 형식만 지켜서 JSON 코드블록 하나로만 출력해줘. 설명 문장은 붙이지 마.

{
  "id": "ep_slug",
  "ep": "EP 12",
  "codename": "SAFFRON / 150 FLOWERS",
  "titles": ["...", "...", "..."],
  "thumb": { "frame": "0-1초 썸네일 프레임 설명", "bigText": "150 FLOWERS", "firstLine": "첫 대사" },
  "toneNote": "이 편의 톤 주의사항 (없으면 빈 문자열)",
  "styleBase": "모든 프롬프트 끝에 붙일 STYLE BASE 전문",
  "extraStills": [ { "name":"HERO B — ...", "ref":"HERO A", "prompt":"...", "reroll":["..."] } ],
  "cuts": [
    { "n":1, "role":"HOOK", "time":"0.0–4.5",
      "vo":"나레이션 한 줄",
      "onScreen":"BIG TEXT", "sfx":"whoosh @ 0.0", "hud":"", "tone":"웃김 가능",
      "mainBeat": false,
      "still": { "ref":"없음 (최초 생성)", "styleBase":true, "prompt":"영어 프롬프트 전문", "reroll":["버릴 것 1","버릴 것 2"] },
      "flow":  { "len":"5s", "motion":"모션 지시", "prompt":"Flow 프롬프트 전문", "reroll":["버릴 것"] } }
  ],
  "loop": { "last":"…마지막 3단어", "first":"첫 3단어…", "note":"루프가 물리는 이유 한 줄" },
  "description": "설명란 본문",
  "hashtags": "#shorts #foodscience ...",
  "facts": [ { "claim":"수치/주장", "source":"출처", "confidence":"확인됨" } ],
  "endCard": "EP 13 — ..."
}`;

/* ══════════════════════════════════════════════
   seed episode
   ══════════════════════════════════════════════ */
const WASABI_BASE=`Cinematic macro documentary photography. Cool Japanese palette — wet slate grey, pale jade green,
dark cypress wood, brushed steel. One low cold key light from the left, a faint warm practical far
behind falling out of focus; everything else drops to near-black. Shallow depth of field, subtle
film grain, photorealistic, 9:16 vertical, ultra high resolution.
No text, no captions, no watermarks, no on-screen graphics.
NO FACES — hands and forearms only, everything above the chest cropped out of frame.
No brand logos, no lettering, no recognizable trademarks, no packaging marks of any kind.`;

const SEED=[{
 id:"ep_wasabi_99", ep:"EP 09", codename:"WASABI / 99%",
 titles:["99% of the Wasabi You've Eaten Wasn't Wasabi","Real Wasabi Dies 15 Minutes After Grating","Why Almost No One Serves Real Wasabi"],
 thumb:{frame:"완벽하게 쥔 니기리 위로 무지 튜브에서 형광 초록 페이스트가 터무니없이 길게 밀려 나오는 순간. 나이 든 손, 편백 카운터.",bigText:"99% NOT WASABI",firstLine:"Ninety-nine percent of it was never wasabi."},
 toneNote:"무표정 부조리로 간다. 코미디로 가지 않는다. 웃긴 건 짜는 양이지 연기가 아니다. 여기서 코미디로 한 발 넘어가면 컷 4의 분자 컷이 신뢰를 잃는다.",
 styleBase:WASABI_BASE,
 extraStills:[{name:"HERO B — 매크로 기준 (두 번째로 확정)",ref:"HERO A",prompt:`Extreme macro, low three-quarter angle: a fresh wasabi rhizome held against a traditional
sharkskin grater. The rhizome is knobbly and irregular, pale jade at the cut end darkening to
deep green along its length, with the ring scars of trimmed leaf stems spiralling up it and a few
fine pale roots still attached — clearly a root, not a smooth vegetable. The grater surface is a
dense field of tiny natural denticles, matte and slightly translucent, mounted on dark cypress.
A thin smear of just-grated wasabi sits at the base of the grater, coarse and still wet.
Razor-shallow depth of field on the contact point between rhizome and grater.`,
  reroll:["뿌리가 매끈하거나 균일한 초록이면 폐기","강판이 금속 격자면 폐기 (상어가죽 돌기여야 함)","간 것이 곱게 뭉쳐 있으면 폐기 (거칠어야 함)"]}],
 cuts:[
 {n:1,role:"HOOK",time:"0.0–4.0",vo:"Ninety-nine percent of it was never wasabi.",onScreen:"99% NOT WASABI",sfx:"whoosh @ 0.0 + 튜브 짜이는 소리",hud:"",tone:"웃김 가능",mainBeat:false,
  still:{ref:"없음 — HERO A, 최고해상도로 제일 먼저",styleBase:true,prompt:`Extreme close-up across a pale cypress sushi counter, camera low and level with the wood. A single
piece of nigiri sits perfectly formed in the centre of frame — loose glossy rice, a clean drape of
deep red tuna, immaculate. Above it, two weathered older hands hold a plain unmarked white
squeeze tube angled down at the fish. A thick coil of vivid artificial green paste is extruding
from the nozzle in one continuous unbroken rope, far more than anyone would ever use, already
mounded over the tuna and beginning to slump down the side of the rice onto the wood.
The hands are calm, steady and unhurried — the grip of someone who has done this ten thousand
times. Crisp white chef's jacket cuffs at the wrists. Everything above the forearms is cropped out
of frame. The green of the paste is flat, saturated and unnaturally even against the muted wood
and the deep red of the fish.
Razor-shallow depth of field on the point where the paste leaves the nozzle.`,
   reroll:["손이 젊거나 매끈하면 폐기 — 세월이 보여야 장인이 성립","짜는 양이 적으면 폐기 — 터무니없어야 훅이 된다","페이스트 줄기가 끊겨 있으면 폐기","니기리가 허술하면 폐기 — 완벽한 니기리 ↔ 조잡한 페이스트가 이 컷의 전부","튜브에 글자·무늬가 보이면 폐기 / 얼굴이 조금이라도 들어오면 폐기"]},
  flow:{len:"5s",motion:"카메라 완전 고정 · 피사체만 움직임",prompt:`Locked-off extreme close-up on the cypress counter. The green paste keeps extruding from the tube

Camera: absolutely locked off. No push-in, no drift, no shake — the extruding paste provides all

let eps=[],cur=0,tab="brief";
function load(){
  const raw=store.get("howloop.eps");
  eps=raw?JSON.parse(raw):JSON.parse(JSON.stringify(SEED));
  const c=store.get("howloop.cur"); cur=c?Math.min(+c,eps.length-1):0;
}
function save(){store.set("howloop.eps",JSON.stringify(eps));store.set("howloop.cur",cur)}
const E=()=>eps[cur];

const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const words=t=>(t||"").trim()?(t.trim().match(/\S+/g)||[]).length:0;
const sents=t=>((t||"").match(/[.!?]+(?=\s|$)/g)||[]).length;

function budget(ep){
  let w=0,s=0;
  ep.cuts.forEach(c=>{w+=words(c.vo);s+=sents(c.vo)});
  const sec=w/2.7+s*0.35+2;
  return{w,s,cuts:ep.cuts.length,sec:Math.round(sec*10)/10};
}

let tt;
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),1500)}
function copy(text,label){
  const done=()=>toast((label||"복사")+" ✓");
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(text).then(done).catch(()=>fb())}else fb();
  function fb(){const a=document.createElement("textarea");a.value=text;a.style.position="fixed";a.style.opacity="0";document.body.appendChild(a);a.select();try{document.execCommand("copy");done()}catch(e){toast("복사 실패 — 직접 선택해 주세요")}a.remove()}
}
function copySchema(){copy(SCHEMA_NOTE,"스키마")}
function copyPrompt(ci,kind){
  const ep=E();
  let p,base;
  if(kind==="extra"){p=ep.extraStills[ci].prompt;base=true}
  else{const c=ep.cuts[ci];p=kind==="still"?c.still.prompt:c.flow.prompt;base=kind==="still"?c.still.styleBase!==false:false}
  const out=base&&ep.styleBase?p.trim()+"\n\n"+ep.styleBase.trim():p.trim();
  copy(out,"프롬프트");
}
function flag(key){const k="howloop."+E().id+"."+key;const v=store.get(k)==="1";store.set(k,v?"0":"1");render()}
function isOn(key){return store.get("howloop."+E().id+"."+key)==="1"}

function render(){
  const ep=E();
  document.getElementById("eplist").innerHTML=eps.map((e,i)=>
    `<button class="epbtn ${i===cur?"on":""}" onclick="pick(${i})">${esc(e.codename||e.id)}<small>${esc(e.ep||"")}</small></button>`).join("");

  if(tab==="import"){renderImport();document.getElementById("tally").textContent="";return}

  const b=budget(ep);
  let sd=0,vd=0;ep.cuts.forEach((c,i)=>{if(isOn("s"+i))sd++;if(isOn("v"+i))vd++});
  document.getElementById("tally").innerHTML=`STILLS <b>${sd}/${ep.cuts.length}</b> &nbsp;▪&nbsp; CLIPS <b>${vd}/${ep.cuts.length}</b>${store.live?"":" &nbsp;▪&nbsp; <span style='color:#E23A24'>저장 꺼짐</span>"}`;

  const gauge=(lab,val,lim,bad,ratio)=>`<div class="g"><div class="lab">${lab}</div>
    <div class="val ${bad?"bad":""}">${val}</div><div class="lim">${lim}</div>
    <div class="bar"><i class="${bad?"bad":""}" style="width:${Math.min(100,ratio*100)}%"></i></div></div>`;

  const secBad=b.sec<33||b.sec>36;
  const gauges=`<div class="gauges">
    ${gauge("WORDS",b.w,"limit 78",b.w>78,b.w/78)}
    ${gauge("SENTENCES",b.s,"limit 12",b.s>12,b.s/12)}
    ${gauge("CUTS",b.cuts,"fixed 6",b.cuts!==6,b.cuts/6)}
    ${gauge("RUNTIME",b.sec+"s","target 33–36",secBad,b.sec/36)}
  </div>
  <div class="formula">( ${b.w} ÷ 2.7 = ${(b.w/2.7).toFixed(1)} ) + ( ${b.s} × 0.35 = ${(b.s*0.35).toFixed(2)} ) + 2 = <b>${b.sec}s</b> <span class="${secBad?"fail":""}">${secBad?"✗ 예산 초과 — 리라이트":"✓ 예산 통과"}</span></div>`;

  const tabs=[["brief","BRIEF"],["cuts","CUTS"],["stills","STILLS"],["flow","FLOW"],["ship","SHIP"]]
    .map(([k,l])=>`<button class="tab ${tab===k?"on":""}" onclick="go('${k}')">${l}</button>`).join("");

  document.getElementById("main").innerHTML=`
    <div class="ephead"><span class="epno">${esc(ep.ep||"EP")}</span>
      <h1 class="epname">${esc(ep.codename||ep.id)}</h1></div>
    <div class="epsub">9:16 · 6컷 · LOCKED 템플릿 · 엔딩 카드 「${esc(ep.endCard||"—")}」</div>
    ${gauges}
    <div class="tabs">${tabs}</div>
    <div id="body">${({brief:vBrief,cuts:vCuts,stills:vStills,flow:vFlow,ship:vShip}[tab])(ep)}</div>`;

  document.querySelectorAll("textarea.vo").forEach(t=>{autosize(t);t.addEventListener("input",e=>{
    E().cuts[+e.target.dataset.i].vo=e.target.value;autosize(e.target);save();liveBudget();})});
}
function autosize(t){t.style.height="auto";t.style.height=t.scrollHeight+"px"}
function liveBudget(){
  const b=budget(E()),g=document.querySelectorAll(".gauges .g");
  if(!g.length)return;
  const set=(i,v,bad,r)=>{const el=g[i];el.querySelector(".val").textContent=v;el.querySelector(".val").classList.toggle("bad",bad);
    const bar=el.querySelector(".bar i");bar.style.width=Math.min(100,r*100)+"%";bar.classList.toggle("bad",bad)};
  set(0,b.w,b.w>78,b.w/78);set(1,b.s,b.s>12,b.s/12);set(2,b.cuts,b.cuts!==6,b.cuts/6);
  const sb=b.sec<33||b.sec>36;set(3,b.sec+"s",sb,b.sec/36);
  document.querySelector(".formula").innerHTML=`( ${b.w} ÷ 2.7 = ${(b.w/2.7).toFixed(1)} ) + ( ${b.s} × 0.35 = ${(b.s*0.35).toFixed(2)} ) + 2 = <b>${b.sec}s</b> <span class="${sb?"fail":""}">${sb?"✗ 예산 초과 — 리라이트":"✓ 예산 통과"}</span>`;
}
function pick(i){cur=i;tab="brief";save();render();window.scrollTo(0,0)}

      <span class="pill">ref: ${esc(ref)}</span>${extraPills||""}
      <div class="prtools">
        ${tickKey?`<button class="tick ${isOn(tickKey)?"on":""}" onclick="flag('${tickKey}')"><i></i>${tickLabel}</button>`:""}
        <button class="btn pri" onclick="${copyFn}">COPY</button>
      </div></div>
    <pre class="code">${esc(promptText)}</pre>
    ${reroll&&reroll.length?`<div class="reroll"><div class="rh">버릴 것</div><ul>${reroll.map(r=>`<li>${esc(r)}</li>`).join("")}</ul></div>`:""}
  </div>`;
}

function vStills(ep){
  let out=`<p class="note" style="margin-bottom:16px">COPY를 누르면 STYLE BASE가 자동으로 뒤에 붙습니다. 컷 4는 붙지 않습니다 — 톤 단절이 규칙이니까요.</p>`;
  (ep.extraStills||[]).forEach((s,i)=>{
    out+=promptCard(s.name,s.ref,s.prompt,s.reroll,`copyPrompt(${i},'extra')`,"x"+i,"DONE",false,"");
  });
  ep.cuts.forEach((c,i)=>{
    out+=promptCard(`CUT ${c.n} — ${c.role}`,c.still.ref,c.still.prompt,c.still.reroll,
      `copyPrompt(${i},'still')`,"s"+i,"STILL ✓",c.mainBeat,
      c.still.styleBase===false?`<span class="pill cold">STYLE BASE 미적용</span>`:"");
  });
  return out;
}
function vFlow(ep){
  let out=`<p class="note" style="margin-bottom:16px">전부 image-to-video입니다. 스틸을 먼저 넣고 프롬프트를 붙이세요. 카메라와 피사체 중 하나만 움직입니다.</p>`;
  ep.cuts.forEach((c,i)=>{
    out+=promptCard(`CUT ${c.n} — ${c.role}`,`CUT ${c.n} 스틸`,c.flow.prompt,c.flow.reroll,
      `copyPrompt(${i},'flow')`,"v"+i,"CLIP ✓",c.mainBeat,
      `<span class="pill amber">${esc(c.flow.len)}</span><span class="pill">${esc(c.flow.motion)}</span>`);
  });
  return out;
}
function vShip(ep){
  const desc=ep.description+"\n\nMore kitchen science every day at @TheNerdBites\n\n"+ep.hashtags;
  return `
  <div class="sec"><div class="sech">설명란 + 해시태그</div>
    <div class="pr"><div class="prh"><span class="prt">DESCRIPTION</span>
      <div class="prtools"><button class="btn pri" onclick="copyDesc()">COPY</button></div></div>
      <pre class="code">${esc(desc)}</pre></div></div>

  <div class="sec"><div class="sech">팩트 근거</div>
    <div class="card" style="padding:0"><table class="facts">
      <tr><th>수치 / 주장</th><th>근거</th><th>신뢰도</th></tr>
      ${ep.facts.map(f=>`<tr><td>${esc(f.claim)}</td><td class="note">${esc(f.source)}</td><td>${esc(f.confidence)}</td></tr>`).join("")}
    </table></div></div>

  <div class="sec"><div class="sech">엔딩 카드</div>
    <div class="card"><div class="slam" style="font-size:26px">${esc(ep.endCard)}</div>
    <p class="note" style="margin:10px 0 0">Subscribe 문구 금지 — 다음 편 제목으로 대체합니다.</p></div></div>

  <div class="sec"><div class="sech">제출 전 체크</div>
    <div class="checkl">${PREFLIGHT.map((p,i)=>
      `<button class="${isOn("p"+i)?"on":""}" onclick="flag('p${i}')"><i></i>${esc(p)}</button>`).join("")}</div></div>

  <div class="sec"><div class="sech">데이터</div>
    <div class="card" style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn" onclick="exportEp()">이 에피소드 JSON 복사</button>
      <button class="btn" onclick="go('import')">새 에피소드 붙여넣기</button>
      <button class="btn" onclick="delEp()">이 에피소드 삭제</button>
    </div></div>`;
}
function copyDesc(){const e=E();copy(e.description+"\n\nMore kitchen science every day at @TheNerdBites\n\n"+e.hashtags,"설명란")}
function exportEp(){copy(JSON.stringify(E(),null,2),"JSON")}
function delEp(){
  if(eps.length<2){toast("마지막 에피소드는 지울 수 없습니다");return}
  if(!confirm("삭제합니다. 되돌릴 수 없어요.\n\n"+(E().codename||E().id)))return;
  eps.splice(cur,1);cur=0;save();render();
}

function renderImport(){
  document.getElementById("main").innerHTML=`
    <div class="ephead"><span class="epno">IMPORT</span><h1 class="epname">새 에피소드</h1></div>
    <div class="epsub">Claude가 준 JSON을 그대로 붙여넣으면 대시보드가 됩니다. 코드블록 백틱은 있어도 됩니다.</div>
    <div class="sec"><div class="sech">1 — Claude에게 요청</div>
      <div class="card"><p class="note" style="margin:0 0 12px">아래 요청문을 복사해서 제목과 함께 던지면, 이 대시보드가 읽는 형식으로 돌려줍니다.</p>
      <button class="btn pri" onclick="copySchema()">요청문 복사</button></div></div>
    <div class="sec"><div class="sech">2 — 붙여넣기</div>
      <textarea class="paste" id="pastebox" placeholder='{ "id": "ep_...", "codename": "...", "cuts": [ ... ] }'></textarea>
      <div style="display:flex;gap:8px;margin-top:10px">
        <button class="btn pri" onclick="doImport()">에피소드 추가</button>
        <button class="btn" onclick="go('brief')">취소</button>
      </div>
      <p class="note" id="imperr" style="color:var(--red);margin-top:10px"></p></div>`;
}
function doImport(){
  const raw=document.getElementById("pastebox").value.trim().replace(/^```(?:json)?/,"").replace(/```$/,"").trim();
  const err=document.getElementById("imperr");
  let o;
  try{o=JSON.parse(raw)}catch(e){err.textContent="JSON을 읽지 못했습니다 — 중괄호 바깥에 설명 문장이 섞여 있는지 확인해 주세요.";return}
  if(!o||!Array.isArray(o.cuts)||!o.cuts.length){err.textContent="cuts 배열이 없습니다. 컷 목록이 빠졌어요.";return}
  o.id=o.id||("ep_"+Date.now());
  o.cuts=o.cuts.map((c,i)=>({n:c.n||i+1,role:c.role||"",time:c.time||"",vo:c.vo||"",onScreen:c.onScreen||"",
    sfx:c.sfx||"",hud:c.hud||"",tone:c.tone||"",mainBeat:!!c.mainBeat,
    still:Object.assign({ref:"—",styleBase:true,prompt:"",reroll:[]},c.still||{}),
    flow:Object.assign({len:"6s",motion:"",prompt:"",reroll:[]},c.flow||{})}));
  o.titles=o.titles||[];o.thumb=Object.assign({frame:"",bigText:"",firstLine:""},o.thumb||{});
  o.loop=Object.assign({last:"",first:"",note:""},o.loop||{});
  o.facts=o.facts||[];o.extraStills=o.extraStills||[];
  o.description=o.description||"";o.hashtags=o.hashtags||"";o.endCard=o.endCard||"—";
  eps.push(o);cur=eps.length-1;tab="brief";save();render();toast("추가됨 ✓");window.scrollTo(0,0);
}

load();render();
</script>
</body>
</html>
